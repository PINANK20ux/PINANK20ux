<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121626" />
      <stop offset="100%" stop-color="#0b0e19" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #f1f5f9; letter-spacing: 0.5px; }
    .subtitle { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 11px; fill: #64748b; }
    .item-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #e2e8f0; }
    .item-desc { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 10.5px; fill: #94a3b8; }
  </style>

  <!-- Container -->
  <rect width="460" height="520" rx="16" fill="url(#cardBg)" stroke="#1e2746" stroke-width="1.2" />

  <!-- Header -->
  <g transform="translate(24, 28)">
    <circle cx="6" cy="6" r="4" fill="#ec4899" filter="url(#iconGlow)" />
    <text x="18" y="10" class="title">SPECIALIZATIONS &amp; SERVICES</text>
    <text x="18" y="24" class="subtitle">Crafted design disciplines &amp; creative scope</text>
  </g>

  <!-- LIST OF SERVICES -->
  <!-- 1. Brand Identity -->
  <g transform="translate(24, 76)">
    <!-- Icon Box -->
    <rect width="36" height="36" rx="8" fill="#241328" stroke="#a21caf" stroke-width="1" />
    <!-- Icon: Shield / Star -->
    <path d="M 18 10 L 25 14 L 25 21 C 25 25 18 28 18 28 C 18 28 11 25 11 21 L 11 14 Z" fill="none" stroke="#ec4899" stroke-width="1.6" filter="url(#iconGlow)" />
    <text x="48" y="16" class="item-title">Brand Identity &amp; Logo Systems</text>
    <text x="48" y="30" class="item-desc">Comprehensive brand guidelines, logos, marks &amp; stationery</text>
  </g>

  <!-- 2. Digital Illustration -->
  <g transform="translate(24, 136)">
    <rect width="36" height="36" rx="8" fill="#1c1635" stroke="#7e22ce" stroke-width="1" />
    <!-- Icon: Pen / Sparkle -->
    <path d="M 12 24 L 21 15 L 24 18 L 15 27 L 11 28 Z M 22 14 L 24 12 L 27 15 L 25 17 Z" fill="none" stroke="#c084fc" stroke-width="1.5" filter="url(#iconGlow)" />
    <text x="48" y="16" class="item-title">Digital Illustration &amp; Concept Art</text>
    <text x="48" y="30" class="item-desc">High-fidelity digital paintings, characters &amp; visual narratives</text>
  </g>

  <!-- 3. Typography & Lettering -->
  <g transform="translate(24, 196)">
    <rect width="36" height="36" rx="8" fill="#151b3b" stroke="#3b82f6" stroke-width="1" />
    <!-- Icon: 'A' Typography -->
    <path d="M 13 26 L 18 11 L 23 26 M 15 22 L 21 22" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#iconGlow)" />
    <text x="48" y="16" class="item-title">Custom Typography &amp; Lettering</text>
    <text x="48" y="30" class="item-desc">Expressive custom letterforms, monograms &amp; wordmarks</text>
  </g>

  <!-- 4. 3D & CGI Visualization -->
  <g transform="translate(24, 256)">
    <rect width="36" height="36" rx="8" fill="#0f2638" stroke="#0284c7" stroke-width="1" />
    <!-- Icon: 3D Cube -->
    <path d="M 18 10 L 26 14 L 26 23 L 18 27 L 10 23 L 10 14 Z M 18 10 L 18 27 M 10 14 L 18 18 L 26 14" fill="none" stroke="#38bdf8" stroke-width="1.5" filter="url(#iconGlow)" />
    <text x="48" y="16" class="item-title">3D Visualization &amp; Spatial Assets</text>
    <text x="48" y="30" class="item-desc">Stylized 3D models, scene lighting, materials &amp; CGI assets</text>
  </g>

  <!-- 5. Creative UI & Visual Systems -->
  <g transform="translate(24, 316)">
    <rect width="36" height="36" rx="8" fill="#0e282c" stroke="#0d9488" stroke-width="1" />
    <!-- Icon: Layout / Window -->
    <rect x="11" y="12" width="14" height="13" rx="2" fill="none" stroke="#2dd4bf" stroke-width="1.5" filter="url(#iconGlow)" />
    <line x1="11" y1="17" x2="25" y2="17" stroke="#2dd4bf" stroke-width="1.2" />
    <text x="48" y="16" class="item-title">Visual UI &amp; Interactive Design</text>
    <text x="48" y="30" class="item-desc">Creative landing page concepts, wireframes &amp; components</text>
  </g>

  <!-- 6. Print, Packaging & Merch -->
  <g transform="translate(24, 376)">
    <rect width="36" height="36" rx="8" fill="#18232c" stroke="#059669" stroke-width="1" />
    <!-- Icon: Tag / Print -->
    <path d="M 12 18 L 18 12 L 26 12 L 26 20 L 20 26 Z" fill="none" stroke="#34d399" stroke-width="1.5" filter="url(#iconGlow)" />
    <circle cx="22" cy="16" r="1.5" fill="#34d399" />
    <text x="48" y="16" class="item-title">Print Collateral &amp; Packaging</text>
    <text x="48" y="30" class="item-desc">Posters, editorial books, tactile packaging &amp; apparel graphics</text>
  </g>

  <!-- 7. Game Art & Concept Graphics -->
  <g transform="translate(24, 436)">
    <rect width="36" height="36" rx="8" fill="#2d172a" stroke="#db2777" stroke-width="1" />
    <!-- Icon: D20 / Diamond -->
    <polygon points="18,11 25,16 25,23 18,27 11,23 11,16" fill="none" stroke="#f472b6" stroke-width="1.5" filter="url(#iconGlow)" />
    <line x1="18" y1="11" x2="18" y2="27" stroke="#f472b6" stroke-width="1" />
    <text x="48" y="16" class="item-title">Game Graphics &amp; UI Assets</text>
    <text x="48" y="30" class="item-desc">UI HUD assets, game iconography, props &amp; visual worlds</text>
  </g>
</svg>
