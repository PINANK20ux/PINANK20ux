<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121626" />
      <stop offset="100%" stop-color="#0b0e19" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #f1f5f9; letter-spacing: 0.8px; }
    .interest-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #e2e8f0; text-anchor: middle; }
    .interest-sub { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 9.5px; fill: #64748b; text-anchor: middle; }
  </style>

  <!-- Container -->
  <rect width="900" height="120" rx="16" fill="url(#cardBg)" stroke="#1e2746" stroke-width="1.2" />

  <!-- Section Label -->
  <g transform="translate(24, 25)">
    <circle cx="5" cy="5" r="4" fill="#a855f7" filter="url(#neonGlow)" />
    <text x="16" y="9" class="title">INTERESTS &amp; PASSIONS</text>
  </g>

  <!-- Items (y=48) -->
  <!-- 1. Digital Art & Illustration -->
  <g transform="translate(80, 52)">
    <rect x="-20" y="0" width="40" height="34" rx="8" fill="#1e1834" stroke="#a855f7" stroke-width="1" />
    <!-- Canvas / Paintbrush Icon -->
    <rect x="-11" y="7" width="22" height="16" rx="2" fill="none" stroke="#c084fc" stroke-width="1.4" />
    <line x1="-5" y1="18" x2="5" y2="10" stroke="#f472b6" stroke-width="1.4" />
    <text x="0" y="47" class="interest-title">Visual Arts</text>
    <text x="0" y="58" class="interest-sub">Illustration &amp; Craft</text>
  </g>

  <!-- 2. Game Design & Tabletop -->
  <g transform="translate(225, 52)">
    <rect x="-20" y="0" width="40" height="34" rx="8" fill="#1b1d3a" stroke="#6366f1" stroke-width="1" />
    <!-- D20 Polyhedral Die Icon -->
    <polygon points="0,5 11,11 11,23 0,29 -11,23 -11,11" fill="none" stroke="#818cf8" stroke-width="1.4" />
    <line x1="0" y1="5" x2="0" y2="29" stroke="#818cf8" stroke-width="0.8" />
    <text x="0" y="47" class="interest-title">Game Design</text>
    <text x="0" y="58" class="interest-sub">Tabletop &amp; Concept</text>
  </g>

  <!-- 3. Culinary & Coffee -->
  <g transform="translate(370, 52)">
    <rect x="-20" y="0" width="40" height="34" rx="8" fill="#251b1f" stroke="#f43f5e" stroke-width="1" />
    <!-- Coffee / Pan Icon -->
    <path d="M -9 11 L 9 11 L 7 24 L -7 24 Z" fill="none" stroke="#fb7185" stroke-width="1.4" />
    <path d="M 7 14 C 11 14 11 20 7 20" fill="none" stroke="#fb7185" stroke-width="1.2" />
    <text x="0" y="47" class="interest-title">Culinary Craft</text>
    <text x="0" y="58" class="interest-sub">Artisanal Coffee</text>
  </g>

  <!-- 4. Creative Community -->
  <g transform="translate(515, 52)">
    <rect x="-20" y="0" width="40" height="34" rx="8" fill="#112435" stroke="#0284c7" stroke-width="1" />
    <!-- Users / Community Icon -->
    <circle cx="-5" cy="14" r="4" fill="none" stroke="#38bdf8" stroke-width="1.3" />
    <circle cx="5" cy="14" r="4" fill="none" stroke="#38bdf8" stroke-width="1.3" />
    <path d="M -11 26 C -11 21 -3 21 -3 26" fill="none" stroke="#38bdf8" stroke-width="1.2" />
    <path d="M 3 26 C 3 21 11 21 11 26" fill="none" stroke="#38bdf8" stroke-width="1.2" />
    <text x="0" y="47" class="interest-title">Community</text>
    <text x="0" y="58" class="interest-sub">Collaborations</text>
  </g>

  <!-- 5. Travel & Exploration -->
  <g transform="translate(660, 52)">
    <rect x="-20" y="0" width="40" height="34" rx="8" fill="#10252b" stroke="#0d9488" stroke-width="1" />
    <!-- Compass / Van Icon -->
    <circle cx="0" cy="17" r="9" fill="none" stroke="#2dd4bf" stroke-width="1.3" />
    <polygon points="0,11 3,17 0,23 -3,17" fill="#2dd4bf" />
    <text x="0" y="47" class="interest-title">Exploration</text>
    <text x="0" y="58" class="interest-sub">Travel &amp; Culture</text>
  </g>

  <!-- 6. Urban Art & Architecture -->
  <g transform="translate(805, 52)">
    <rect x="-20" y="0" width="40" height="34" rx="8" fill="#252119" stroke="#d97706" stroke-width="1" />
    <!-- Architecture / Spray Icon -->
    <polygon points="-8,25 -8,11 0,6 8,11 8,25" fill="none" stroke="#fbbf24" stroke-width="1.3" />
    <line x1="-3" y1="25" x2="-3" y2="19" stroke="#fbbf24" stroke-width="1.2" />
    <line x1="3" y1="25" x2="3" y2="19" stroke="#fbbf24" stroke-width="1.2" />
    <text x="0" y="47" class="interest-title">Architecture</text>
    <text x="0" y="58" class="interest-sub">Urban &amp; Modern</text>
  </g>
</svg>
