<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 190" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121626" />
      <stop offset="100%" stop-color="#0b0e19" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #f1f5f9; letter-spacing: 0.5px; }
    .subtitle { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 11px; fill: #64748b; }
    .btn-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 11.5px; font-weight: 600; fill: #ffffff; }
    .contact-item { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 11px; fill: #cbd5e1; }
  </style>

  <!-- Container -->
  <rect width="500" height="190" rx="16" fill="url(#cardBg)" stroke="#1e2746" stroke-width="1.2" />

  <!-- Header -->
  <g transform="translate(24, 25)">
    <circle cx="5" cy="5" r="4" fill="#38bdf8" filter="url(#neonGlow)" />
    <text x="16" y="9" class="title">PORTFOLIO &amp; GET IN TOUCH</text>
    <text x="16" y="23" class="subtitle">Direct showcases, creative inquiries &amp; collaborations</text>
  </g>

  <!-- Portfolio Buttons Row (y=62) -->
  <g transform="translate(24, 62)">
    <!-- Behance -->
    <rect width="142" height="34" rx="8" fill="#0057ff" fill-opacity="0.25" stroke="#0057ff" stroke-width="1.2" />
    <text x="18" y="21" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#38bdf8">Bē</text>
    <text x="44" y="21" class="btn-text">Behance</text>

    <!-- Dribbble -->
    <g transform="translate(150, 0)">
      <rect width="142" height="34" rx="8" fill="#ea4c89" fill-opacity="0.22" stroke="#ea4c89" stroke-width="1.2" />
      <circle cx="20" cy="17" r="7" fill="none" stroke="#f472b6" stroke-width="1.4" />
      <text x="36" y="21" class="btn-text">Dribbble</text>
    </g>

    <!-- ArtStation -->
    <g transform="translate(300, 0)">
      <rect width="150" height="34" rx="8" fill="#13aff0" fill-opacity="0.22" stroke="#13aff0" stroke-width="1.2" />
      <polygon points="14,24 22,10 30,24" fill="none" stroke="#38bdf8" stroke-width="1.4" />
      <text x="38" y="21" class="btn-text">ArtStation</text>
    </g>
  </g>

  <!-- Contacts Row (y=114) -->
  <g transform="translate(24, 114)">
    <line x1="0" y1="0" x2="452" y2="0" stroke="#1c233c" stroke-width="1" />
    
    <!-- Email Contact -->
    <g transform="translate(0, 16)">
      <rect width="218" height="36" rx="8" fill="#141a2c" stroke="#263152" stroke-width="1" />
      <circle cx="20" cy="18" r="8" fill="#1e293b" />
      <text x="20" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#ec4899">✉</text>
      <text x="38" y="22" class="contact-item">pinank.visuals@gmail.com</text>
    </g>

    <!-- Instagram / Social Handle -->
    <g transform="translate(230, 16)">
      <rect width="222" height="36" rx="8" fill="#141a2c" stroke="#263152" stroke-width="1" />
      <circle cx="20" cy="18" r="8" fill="#1e293b" />
      <text x="20" y="22" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#38bdf8">✦</text>
      <text x="38" y="22" class="contact-item">@PINANK20ux</text>
    </g>
  </g>
</svg>
