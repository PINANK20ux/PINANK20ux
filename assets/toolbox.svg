<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121626" />
      <stop offset="100%" stop-color="#0b0e19" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #f1f5f9; letter-spacing: 0.8px; }
    .tool-label { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #e2e8f0; }
  </style>

  <!-- Container -->
  <rect width="900" height="100" rx="16" fill="url(#cardBg)" stroke="#1e2746" stroke-width="1.2" />

  <!-- Section Label -->
  <g transform="translate(24, 25)">
    <circle cx="5" cy="5" r="4" fill="#38bdf8" filter="url(#neonGlow)" />
    <text x="16" y="9" class="title">CREATIVE TOOLBOX &amp; SOFTWARE</text>
  </g>

  <!-- Tools Row (y=48) -->
  <!-- 1. Photoshop -->
  <g transform="translate(24, 46)">
    <rect width="88" height="38" rx="8" fill="#0c1d33" stroke="#001e36" stroke-width="1.2" />
    <rect x="7" y="7" width="24" height="24" rx="5" fill="#001e36" stroke="#31a8ff" stroke-width="1" />
    <text x="19" y="23" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#31a8ff">Ps</text>
    <text x="38" y="23" class="tool-label">Photoshop</text>
  </g>

  <!-- 2. Illustrator -->
  <g transform="translate(120, 46)">
    <rect width="88" height="38" rx="8" fill="#291b0f" stroke="#331f00" stroke-width="1.2" />
    <rect x="7" y="7" width="24" height="24" rx="5" fill="#331f00" stroke="#ff9a00" stroke-width="1" />
    <text x="19" y="23" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#ff9a00">Ai</text>
    <text x="38" y="23" class="tool-label">Illustrator</text>
  </g>

  <!-- 3. Figma -->
  <g transform="translate(216, 46)">
    <rect width="80" height="38" rx="8" fill="#1e1828" stroke="#a259ff" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="19" cy="19" r="10" fill="#2d1c3e" />
    <!-- Mini Figma Logo Colors -->
    <circle cx="15" cy="15" r="3" fill="#f24e1e" />
    <circle cx="23" cy="15" r="3" fill="#ff7262" />
    <circle cx="15" cy="22" r="3" fill="#a259ff" />
    <circle cx="23" cy="22" r="3" fill="#1abcfe" />
    <text x="36" y="23" class="tool-label">Figma</text>
  </g>

  <!-- 4. InDesign -->
  <g transform="translate(304, 46)">
    <rect width="84" height="38" rx="8" fill="#260f1b" stroke="#49021f" stroke-width="1.2" />
    <rect x="7" y="7" width="24" height="24" rx="5" fill="#49021f" stroke="#ff3366" stroke-width="1" />
    <text x="19" y="23" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#ff3366">Id</text>
    <text x="37" y="23" class="tool-label">InDesign</text>
  </g>

  <!-- 5. Blender 3D -->
  <g transform="translate(396, 46)">
    <rect width="84" height="38" rx="8" fill="#241913" stroke="#ea7600" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="19" cy="19" r="10" fill="#ea7600" fill-opacity="0.2" />
    <circle cx="19" cy="19" r="5" fill="#ea7600" />
    <circle cx="24" cy="15" r="2" fill="#22c55e" />
    <text x="37" y="23" class="tool-label">Blender</text>
  </g>

  <!-- 6. After Effects -->
  <g transform="translate(488, 46)">
    <rect width="98" height="38" rx="8" fill="#1b122c" stroke="#22003b" stroke-width="1.2" />
    <rect x="7" y="7" width="24" height="24" rx="5" fill="#22003b" stroke="#9999ff" stroke-width="1" />
    <text x="19" y="23" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#9999ff">Ae</text>
    <text x="38" y="23" class="tool-label">After Effects</text>
  </g>

  <!-- 7. Spline 3D -->
  <g transform="translate(594, 46)">
    <rect width="78" height="38" rx="8" fill="#141c2c" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
    <polygon points="19,12 25,18 19,25 13,18" fill="#38bdf8" />
    <text x="34" y="23" class="tool-label">Spline</text>
  </g>

  <!-- 8. Procreate -->
  <g transform="translate(680, 46)">
    <rect width="94" height="38" rx="8" fill="#181a2e" stroke="#818cf8" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="19" cy="19" r="8" fill="#4338ca" />
    <path d="M 16 22 C 16 16, 22 17, 22 15" stroke="#a5b4fc" stroke-width="1.5" fill="none" />
    <text x="36" y="23" class="tool-label">Procreate</text>
  </g>

  <!-- 9. Notion -->
  <g transform="translate(782, 46)">
    <rect width="94" height="38" rx="8" fill="#151b26" stroke="#475569" stroke-width="1" stroke-opacity="0.4" />
    <rect x="8" y="9" width="18" height="20" rx="3" fill="#334155" />
    <text x="17" y="23" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#f8fafc">N</text>
    <text x="34" y="23" class="tool-label">Notion / Docs</text>
  </g>
</svg>
