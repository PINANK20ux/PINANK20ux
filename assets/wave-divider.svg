<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="100%" height="100%">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111526" />
      <stop offset="100%" stop-color="#0c0e1a" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="7" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Wave Line Gradient -->
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="25%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="75%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="subWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <style>
    .grid-line { stroke: #1e2640; stroke-width: 1; stroke-dasharray: 2 4; }
    .dot { transition: all 0.3s ease; }
    .dot:hover { r: 6; }
  </style>

  <!-- Container -->
  <rect width="900" height="80" rx="14" fill="url(#cardBg)" stroke="#1e2746" stroke-width="1.2" />

  <!-- Grid lines -->
  <line x1="50" y1="40" x2="850" y2="40" stroke="#1c233c" stroke-width="1" />
  <line x1="120" y1="15" x2="120" y2="65" class="grid-line" />
  <line x1="220" y1="15" x2="220" y2="65" class="grid-line" />
  <line x1="320" y1="15" x2="320" y2="65" class="grid-line" />
  <line x1="420" y1="15" x2="420" y2="65" class="grid-line" />
  <line x1="520" y1="15" x2="520" y2="65" class="grid-line" />
  <line x1="620" y1="15" x2="620" y2="65" class="grid-line" />
  <line x1="720" y1="15" x2="720" y2="65" class="grid-line" />
  <line x1="820" y1="15" x2="820" y2="65" class="grid-line" />

  <!-- Ghost Sub-wave -->
  <path d="M 50 40 
           C 90 20, 130 58, 170 38 
           C 210 18, 250 62, 290 40 
           C 330 18, 370 55, 410 35 
           C 450 15, 490 60, 530 40 
           C 570 20, 610 58, 650 36 
           C 690 14, 730 62, 770 38 
           C 810 14, 840 50, 850 40" 
        fill="none" stroke="url(#subWave)" stroke-width="2" />

  <!-- Main Sine Wave with Glow -->
  <path d="M 50 40 
           C 80 50, 110 15, 140 40 
           C 170 65, 200 18, 230 38 
           C 260 58, 290 12, 320 40 
           C 350 68, 380 20, 410 38 
           C 440 56, 470 10, 500 40 
           C 530 70, 560 16, 590 38 
           C 620 60, 650 18, 680 40 
           C 710 62, 740 12, 770 38 
           C 800 64, 830 25, 850 40" 
        fill="none" stroke="url(#waveGradient)" stroke-width="3" filter="url(#neonGlow)" />

  <!-- Glowing Nodes / Equalizer Ticks -->
  <!-- 1 -->
  <circle cx="110" cy="18" r="4.5" fill="#ec4899" filter="url(#neonGlow)" />
  <line x1="110" y1="18" x2="110" y2="40" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="2 2" />
  
  <!-- 2 -->
  <circle cx="200" cy="18" r="4" fill="#d946ef" filter="url(#neonGlow)" />
  <line x1="200" y1="18" x2="200" y2="40" stroke="#d946ef" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="2 2" />

  <!-- 3 -->
  <circle cx="290" cy="12" r="5" fill="#a855f7" filter="url(#neonGlow)" />
  <line x1="290" y1="12" x2="290" y2="40" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.7" stroke-dasharray="2 2" />

  <!-- 4 -->
  <circle cx="380" cy="20" r="4" fill="#818cf8" filter="url(#neonGlow)" />
  <line x1="380" y1="20" x2="380" y2="40" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="2 2" />

  <!-- 5 (Peak Center) -->
  <circle cx="470" cy="10" r="5.5" fill="#6366f1" filter="url(#neonGlow)" />
  <line x1="470" y1="10" x2="470" y2="40" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.8" stroke-dasharray="2 2" />

  <!-- 6 -->
  <circle cx="560" cy="16" r="4.5" fill="#38bdf8" filter="url(#neonGlow)" />
  <line x1="560" y1="16" x2="560" y2="40" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="2 2" />

  <!-- 7 -->
  <circle cx="650" cy="18" r="4" fill="#06b6d4" filter="url(#neonGlow)" />
  <line x1="650" y1="18" x2="650" y2="40" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="2 2" />

  <!-- 8 -->
  <circle cx="740" cy="12" r="5" fill="#10b981" filter="url(#neonGlow)" />
  <line x1="740" y1="12" x2="740" y2="40" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.7" stroke-dasharray="2 2" />

  <!-- Accent bottom mini glow -->
  <circle cx="170" cy="65" r="3.5" fill="#ec4899" opacity="0.8" />
  <circle cx="350" cy="68" r="3.5" fill="#8b5cf6" opacity="0.8" />
  <circle cx="530" cy="70" r="3.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="710" cy="62" r="3.5" fill="#10b981" opacity="0.8" />
</svg>
