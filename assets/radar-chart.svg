<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121626" />
      <stop offset="100%" stop-color="#0b0e19" />
    </linearGradient>

    <!-- Glowing Fill Gradient for Polygon -->
    <linearGradient id="radarFill" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.55" />
    </linearGradient>

    <!-- Glowing Polygon Stroke -->
    <linearGradient id="radarStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Radar Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #f1f5f9; letter-spacing: 0.5px; }
    .subtitle { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 11px; fill: #64748b; }
    .axis-label { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #94a3b8; }
    .axis-label-highlight { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #e2e8f0; }
    .axis-pct { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #38bdf8; }
    .grid-circle { fill: none; stroke: #1e293b; stroke-width: 1; stroke-dasharray: 3 3; }
    .grid-spoke { stroke: #202942; stroke-width: 1.2; }
  </style>

  <!-- Card Background -->
  <rect width="500" height="420" rx="16" fill="url(#cardBg)" stroke="#1e2746" stroke-width="1.2" />

  <!-- Header -->
  <g transform="translate(24, 30)">
    <circle cx="6" cy="6" r="4" fill="#a855f7" filter="url(#neonGlow)" />
    <text x="18" y="10" class="title">COMPETENCIES</text>
    <text x="18" y="24" class="subtitle">Core Design Capabilities &amp; Depth Profile</text>
  </g>

  <!-- Concentric Radar Webs (cx=250, cy=235) -->
  <g id="radar-grid" transform="translate(0, 20)">
    <!-- 20% -->
    <polygon points="250,191 267,198 274,215 267,232 250,239 233,232 226,215 233,198" class="grid-circle" />
    <!-- 40% -->
    <polygon points="250,167 284,181 298,215 284,249 250,263 216,249 202,215 216,181" class="grid-circle" />
    <!-- 60% -->
    <polygon points="250,143 301,164 322,215 301,266 250,287 199,266 178,215 199,164" class="grid-circle" />
    <!-- 80% -->
    <polygon points="250,119 318,147 346,215 318,283 250,311 182,283 154,215 182,147" class="grid-circle" />
    <!-- 100% (Outer Rim) -->
    <polygon points="250,95 335,130 370,215 335,300 250,335 165,300 130,215 165,130" fill="none" stroke="#263152" stroke-width="1.5" />

    <!-- Center Spoke Lines -->
    <line x1="250" y1="215" x2="250" y2="95" class="grid-spoke" />
    <line x1="250" y1="215" x2="335" y2="130" class="grid-spoke" />
    <line x1="250" y1="215" x2="370" y2="215" class="grid-spoke" />
    <line x1="250" y1="215" x2="335" y2="300" class="grid-spoke" />
    <line x1="250" y1="215" x2="250" y2="335" class="grid-spoke" />
    <line x1="250" y1="215" x2="165" y2="300" class="grid-spoke" />
    <line x1="250" y1="215" x2="130" y2="215" class="grid-spoke" />
    <line x1="250" y1="215" x2="165" y2="130" class="grid-spoke" />

    <!-- Center Origin Point -->
    <circle cx="250" cy="215" r="2.5" fill="#475569" />

    <!-- Competency Data Polygon -->
    <!-- Points: Graphic Design (95%), Illustration (88%), Typography (92%), 3D & CGI (78%), Motion (72%), Branding (95%), UI Layout (84%), Concept Art (86%) -->
    <polygon points="250,101 325,140 360,215 316,281 250,301 169,296 149,215 177,143" 
             fill="url(#radarFill)" stroke="url(#radarStroke)" stroke-width="2.5" filter="url(#neonGlow)" />

    <!-- Polygon Vertices (Glowing Dots) -->
    <circle cx="250" cy="101" r="4.5" fill="#ec4899" filter="url(#neonGlow)" />
    <circle cx="325" cy="140" r="4" fill="#d946ef" filter="url(#neonGlow)" />
    <circle cx="360" cy="215" r="4" fill="#a855f7" filter="url(#neonGlow)" />
    <circle cx="316" cy="281" r="3.5" fill="#818cf8" filter="url(#neonGlow)" />
    <circle cx="250" cy="301" r="3.5" fill="#6366f1" filter="url(#neonGlow)" />
    <circle cx="169" cy="296" r="4.5" fill="#38bdf8" filter="url(#neonGlow)" />
    <circle cx="149" cy="215" r="4" fill="#06b6d4" filter="url(#neonGlow)" />
    <circle cx="177" cy="143" r="4" fill="#ec4899" filter="url(#neonGlow)" />

    <!-- Labels positioned around periphery -->
    <!-- Top: Graphic Design -->
    <text x="250" y="78" text-anchor="middle" class="axis-label-highlight">Graphic Design</text>
    <text x="250" y="90" text-anchor="middle" class="axis-pct">95%</text>

    <!-- Top-Right: Illustration -->
    <text x="350" y="120" text-anchor="start" class="axis-label">Illustration</text>
    <text x="350" y="132" text-anchor="start" class="axis-pct">88%</text>

    <!-- Right: Typography & Lettering -->
    <text x="382" y="213" text-anchor="start" class="axis-label">Typography</text>
    <text x="382" y="226" text-anchor="start" class="axis-pct">92%</text>

    <!-- Bottom-Right: 3D & CGI -->
    <text x="348" y="308" text-anchor="start" class="axis-label">3D &amp; CGI</text>
    <text x="348" y="320" text-anchor="start" class="axis-pct">78%</text>

    <!-- Bottom: Motion Design -->
    <text x="250" y="354" text-anchor="middle" class="axis-label">Motion Design</text>
    <text x="250" y="366" text-anchor="middle" class="axis-pct">72%</text>

    <!-- Bottom-Left: Branding & Identity -->
    <text x="145" y="308" text-anchor="end" class="axis-label">Branding &amp; Identity</text>
    <text x="145" y="320" text-anchor="end" class="axis-pct">95%</text>

    <!-- Left: Visual UI -->
    <text x="115" y="213" text-anchor="end" class="axis-label">Visual UI</text>
    <text x="115" y="226" text-anchor="end" class="axis-pct">84%</text>

    <!-- Top-Left: Concept Art -->
    <text x="150" y="120" text-anchor="end" class="axis-label">Concept Art</text>
    <text x="150" y="132" text-anchor="end" class="axis-pct">86%</text>
  </g>
</svg>
